<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Caravan</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="profilepage.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-md">
    <div class="container-fluid">
      <div class="nav-left">
        <a class="navbar-brand" href="index.html">
          <img src="Images/CaravanLogo_Transparent.png" alt="Caravan" height="60" id="Caravan_Logo" />
        </a>
      </div>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav nav-center">
          <li class="nav-item1"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item1"><a class="nav-link" href="storepage.html">Market</a></li>
          <li class="nav-item1"><a class="nav-link" href="FAQs.html">FAQs</a></li>
        </ul>

        <ul class="navbar-nav nav-right">
          <li class="nav-item2"><a class="nav-link" href="cartpage.html">Cart</a></li>
          <li class="nav-item2"><a class="nav-link active" href="profilepage.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Header Title -->
  <header class="page-header">
    <h1>My Profile Page</h1>
  </header>

  <!-- Main Profile Layout Container -->
  <main class="profile-container">
    
    <!-- Sidebar Navigation -->
    <aside class="profile-sidebar">
      <div class="user-greeting">
        <div class="avatar-circle">
          <svg viewBox="0 0 24 24" fill="currentColor" width="36" height="36">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <div class="user-text">
          <span class="hi-text">Hi,</span>
          <span class="user-name">USER ACCOUNT</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <button class="menu-item" data-tab="overview">Account Overview</button>
        <button class="menu-item" data-tab="payment">Payment Methods</button>
        <button class="menu-item active" data-tab="details">My Details</button>
        <button class="menu-item" data-tab="vouchers">Vouchers</button>
        <button class="menu-item" data-tab="wishlist">Wishlist</button>
        <button class="menu-item" data-tab="orders">Order History</button>
      </nav>
    </aside>

    <!-- Tab Contents Container -->
    <section class="profile-content">
      
      <!-- Tab 1: Account Overview -->
      <div class="tab-pane" id="overview">
        <h2 class="content-title">Account Overview</h2>
        
        <form id="accountOverviewForm">
          <div class="form-grid-row">
            <div class="form-field-group">
              <label for="userEmail">E-mail Address</label>
              <input 
                type="email" 
                id="userEmail" 
                class="radius-10-input custom-input-box" 
                placeholder="user@example.com"
              />
            </div>
            <div class="form-field-group">
              <label for="userBirthdate">Birthdate</label>
              <input 
                type="date" 
                id="userBirthdate" 
                class="radius-10-input custom-input-box"
              />
            </div>
          </div>

          <div class="form-field-group">
            <label for="userPassword">Password</label>
            <input 
              type="password" 
              id="userPassword" 
              class="radius-10-input custom-input-box" 
              placeholder="••••••••••••"
            />
          </div>
        </form>

        <div class="form-field-group margin-top-15">
          <label>Recent Transactions</label>
          <div class="radius-10-box large-box">
            <p class="empty-text">No recent transactions to display.</p>
          </div>
        </div>
      </div>

      <!-- Tab 2: Payment Methods -->
      <div class="tab-pane" id="payment">
        <h2 class="content-title">Payment Methods</h2>
        <div class="data-container" id="paymentListContainer"></div>
        <button class="add-btn radius-10-box" id="openCardModalBtn">Add a New Card</button>
      </div>

      <!-- Tab 3: My Details (Starts Clean without Hardcoded Cards) -->
      <div class="tab-pane active" id="details">
        <h2 class="content-title">My Details</h2>
        <div class="data-container" id="addressListContainer"></div>
        <button class="add-btn radius-10-box" id="openAddressModalBtn">Add a New Address</button>
      </div>

      <!-- Tab 4: Vouchers -->
      <div class="tab-pane" id="vouchers">
        <h2 class="content-title">My Vouchers</h2>
        <div class="data-container" id="vouchersListContainer"></div>
      </div>

      <!-- Tab 5: Wishlist -->
      <div class="tab-pane" id="wishlist">
        <h2 class="content-title">My Wishlist</h2>
        <div class="data-container" id="wishlistContainer"></div>
      </div>

      <!-- Tab 6: Order History -->
      <div class="tab-pane" id="orders">
        <h2 class="content-title">Order History</h2>
        <div class="radius-10-box large-box">
          <p class="empty-text">No past orders found.</p>
        </div>
      </div>

    </section>
  </main>

  <!-- Add Address Modal -->
  <div class="modal-overlay" id="addressModal">
    <div class="modal-box radius-10-box">
      <div class="modal-header">
        <h3>Add a New Address</h3>
        <button class="close-modal" id="closeAddressModal">&times;</button>
      </div>
      <form id="addressForm">
        <div class="form-field-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="radius-10-input" required placeholder="John Doe Monroe" />
        </div>
        <div class="form-field-group">
          <label for="phoneNumber">Phone Number</label>
          <input type="tel" id="phoneNumber" class="radius-10-input" required placeholder="+63 999 999 9999" />
        </div>
        <div class="form-field-group">
          <label for="streetAddress">Street Address</label>
          <input type="text" id="streetAddress" class="radius-10-input" required placeholder="4009, Apt 161, Edsa Street" />
        </div>
        <div class="form-grid-row">
          <div class="form-field-group">
            <label for="city">City</label>
            <input type="text" id="city" class="radius-10-input" required placeholder="Antipolo City" />
          </div>
          <div class="form-field-group">
            <label for="zipCode">Zip Code</label>
            <input type="text" id="zipCode" class="radius-10-input" required placeholder="34258" />
          </div>
        </div>
        <button type="submit" class="submit-btn radius-10-box">Save Address</button>
      </form>
    </div>
  </div>

  <!-- Add Card Modal -->
  <div class="modal-overlay" id="cardModal">
    <div class="modal-box radius-10-box">
      <div class="modal-header">
        <h3>Add a New Card</h3>
        <button class="close-modal" id="closeCardModal">&times;</button>
      </div>
      <form id="cardForm">
        <div class="form-field-group">
          <label for="cardHolder">Name on Card</label>
          <input type="text" id="cardHolder" class="radius-10-input" required placeholder="John Doe Monroe" />
        </div>
        <div class="form-field-group">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" class="radius-10-input" maxlength="19" required placeholder="4532 **** **** 8890" />
        </div>
        <div class="form-grid-row">
          <div class="form-field-group">
            <label for="expiryDate">Expiry Date</label>
            <input type="text" id="expiryDate" class="radius-10-input" placeholder="MM/YY" required />
          </div>
          <div class="form-field-group">
            <label for="cvv">CVV</label>
            <input type="password" id="cvv" class="radius-10-input" maxlength="4" required placeholder="123" />
          </div>
        </div>
        <button type="submit" class="submit-btn radius-10-box">Save Card</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="profilepage.js"></script>
</body>
</html>
