<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS Linking -->
    <link rel="stylesheet" href="Login.css" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <title> Login </title>
  </head>
  <body>
    
      <!-- Navbar -->
      <nav class="navbar navbar-expand-md fixed-top">
        <div class="container-fluid">
          <!-- Logo -->
          <div class="nav-left">
            <a class="navbar-brand" href="index.html">
              <img
                src="./Images/CaravanLogo_Transparent.png"
                alt="Caravan"
                height="60"
                id="Caravan_Logo"
              />
            </a>
          </div>

          <!-- Mobile Toggle Button -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Navbar Content -->
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <!-- Center Navigation -->
            <ul class="navbar-nav nav-center">
              <li class="nav-item1">
                <a class="nav-link" href="index.html">Home</a>
              </li>

              <li class="nav-item1">
                <a class="nav-link" href="storepage.html">Market</a>
              </li>

              <li class="nav-item1">
                <a class="nav-link" href="FAQs.html">FAQs</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>


    <!-- Login Form -->
<div class="formContainer container-fluid">
  <div class="form-card">

    <h1 class="form-title">SIGN IN</h1>
    <p class="form-subtitle">Please confirm your details</p>

    <!-- Error Message -->
    <div 
      id="error-message" 
      class="error-message" 
      style="display: none;"
    ></div>

    <!-- Success Message -->
    <div 
      id="success-message" 
      class="success-message" 
      style="display: none;"
    ></div>

    <form class="register-form" id="loginForm">

      <input
        type="text"
        id="email"
        placeholder="Email Address"
         class="form-input"
        name="email"
        autocomplete="email"
       />
       
      <input
        type="password"
        id="password"
        placeholder="Password"
        class="form-input"
        name="password"
        autocomplete="current-password"
        required
      />

      <button
        type="submit"
        class="register-btn"
        id="loginButton"
      >
        Sign In
      </button>

    </form>

    <div class="login-link">
      Don't have an account?
      <a href="RegisterPage.html">Register here</a>
    </div>

  </div>
</div>

<div class="overlay"></div>

    <!-- Bootstrap JavaScript-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- JavaScript Linking -->
    <script src="Login.js"></script>
  </body>
</html>
